# Cenas: telas fixas com objetos interativos (briefing D8, J9, J10).
#
# [recusas] traz as falas genéricas de cada verbo (olhar, usar, falar), usadas quando um
# objeto não tem resposta para o verbo. Elas alternam em rodízio e nunca falam de correntes
# (E4). São obrigatórias quando houver cenas.
#
# `inicio` é a cena onde o novo jogo começa; precisa existir.
#
# Cada tabela de [cenas] com `objetos` é uma cena, e o caminho dela é o ID. Entrar numa cena
# marca a flag "<id da cena>.visitou"; `entrada` (opcional) roda só na primeira visita.
#
# Cada objeto tem:
#   id           nome curto, único na cena
#   nome         ID do texto com o nome do objeto
#   area         [x, y, largura, altura] na resolução lógica de 320×180
#   olhar, usar, falar
#                resposta ao verbo (opcional): lista de passos no formato dos roteiros,
#                { roteiro = "id" } ou { dialogo = "id" }
#   se, se_nao   flags que precisam estar / não podem estar marcadas para o objeto aparecer
#   se_item, se_nao_item
#                itens que precisam estar / não podem estar no inventário (um item coletado
#                pode fazer o objeto sumir)
#
# Exemplo:
#
#   inicio = "praca"
#
#   [recusas]
#   olhar = ["recusa.olhar.1", "recusa.olhar.2"]
#   usar = ["recusa.usar.1", "recusa.usar.2"]
#   falar = ["recusa.falar.1", "recusa.falar.2"]
#
#   [cenas.praca]
#   entrada = { roteiro = "praca.apresentacao" }
#
#   [[cenas.praca.objetos]]
#   id = "folheto"
#   nome = "praca.folheto.nome"
#   area = [40, 100, 16, 12]
#   olhar = [{ fala = "praca.folheto.olhar" }]
#   usar = [{ dar_item = "folheto" }]
#   se_nao_item = ["folheto"]
#
#   [[cenas.praca.objetos]]
#   id = "vendedor"
#   nome = "praca.vendedor.nome"
#   area = [200, 80, 24, 48]
#   falar = { dialogo = "praca.vendedor" }
#
# As cenas "teste.*" são provisórias e neutras: servem para testar a tela de cena e saem quando
# as cenas do capítulo entrarem (PR feat/capitulo-1-jogavel).

inicio = "teste.sala"

[recusas]
olhar = ["recusa.olhar.1", "recusa.olhar.2"]
usar = ["recusa.usar.1", "recusa.usar.2"]
falar = ["recusa.falar.1", "recusa.falar.2"]

[cenas.teste.sala]
entrada = { roteiro = "teste.sala.boas_vindas" }

[[cenas.teste.sala.objetos]]
id = "porta"
nome = "teste.sala.porta.nome"
area = [276, 34, 32, 96]
olhar = [{ fala = "teste.sala.porta.olhar" }]
usar = [{ trocar_cena = "teste.corredor" }]

[[cenas.teste.sala.objetos]]
id = "mesa"
nome = "teste.sala.mesa.nome"
area = [110, 100, 70, 26]
olhar = [{ fala = "teste.sala.mesa.olhar" }]

# O bloco de notas fica em cima da mesa: vem depois dela, então fica por cima no clique.
[[cenas.teste.sala.objetos]]
id = "bloco"
nome = "teste.sala.bloco.nome"
area = [134, 92, 18, 10]
olhar = [{ fala = "teste.sala.bloco.olhar" }]
usar = [{ dar_item = "bloco" }, { fala = "teste.sala.bloco.pegou" }]
se_nao_item = ["bloco"]

[[cenas.teste.sala.objetos]]
id = "relogio"
nome = "teste.sala.relogio.nome"
area = [30, 24, 20, 20]
olhar = [{ fala = "teste.sala.relogio.olhar" }]
usar = [
  { fala = "teste.sala.relogio.corda" },
  { esperar = 1 },
  { fala = "teste.sala.relogio.tique" },
  { fala = "teste.sala.relogio.placa" },
  { marcar_flag = "teste.sala.relogio.leu_placa" },
]

[[cenas.teste.sala.objetos]]
id = "mural"
nome = "teste.sala.mural.nome"
area = [70, 24, 48, 32]
olhar = { checagem = "teste.mural" }

[[cenas.teste.sala.objetos]]
id = "pessoa"
nome = "teste.sala.pessoa.nome"
area = [210, 58, 22, 70]
olhar = [{ fala = "teste.sala.pessoa.olhar" }]
falar = { dialogo = "teste.pessoa" }

[cenas.teste.corredor]

[[cenas.teste.corredor.objetos]]
id = "porta"
nome = "teste.corredor.porta.nome"
area = [12, 34, 32, 96]
olhar = [{ fala = "teste.corredor.porta.olhar" }]
usar = [{ trocar_cena = "teste.sala" }]

[[cenas.teste.corredor.objetos]]
id = "janela"
nome = "teste.corredor.janela.nome"
area = [140, 30, 60, 40]
olhar = [{ fala = "teste.corredor.janela.olhar" }]

[[cenas.teste.corredor.objetos]]
id = "quadro"
nome = "teste.corredor.quadro.nome"
area = [230, 30, 60, 40]
olhar = [{ fala = "teste.corredor.quadro.olhar" }]
usar = [{ abrir_tela = "comparacao" }, { fala = "teste.corredor.quadro.depois" }]

# O pátio só se alcança pelo mapa.
[cenas.teste.patio]

[[cenas.teste.patio.objetos]]
id = "banco"
nome = "teste.patio.banco.nome"
area = [60, 100, 70, 20]
olhar = [{ fala = "teste.patio.banco.olhar" }]

[[cenas.teste.patio.objetos]]
id = "arvore"
nome = "teste.patio.arvore.nome"
area = [200, 30, 50, 100]
olhar = [{ fala = "teste.patio.arvore.olhar" }]
